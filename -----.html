<!doctype html><html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>หอพักไทยร้าง: จับผิดจอวงจรปิด</title>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@500&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#06080a;--pn:#0e1316;--ln:#26323a;--tx:#dfe7e3;--mu:#8a9a92;--rd:#d1343c;--am:#e8d58a;--ok:#7fcf9d;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:15px/1.45 Sarabun,"Noto Sans Thai",system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:8px;cursor:pointer}
button:focus-visible{outline:2px solid var(--am)}
#app{max-width:760px;margin:auto;height:100%;display:flex;flex-direction:column;gap:8px;padding:8px}
#hud{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mu)}
#clk{font:500 22px Mitr,sans-serif;color:var(--am);min-width:68px}
.bar{flex:1;height:8px;background:#1a2227;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;width:100%;background:var(--ok);transition:width .3s}
#thr span{display:inline-block;width:9px;height:9px;margin-left:3px;border-radius:50%;background:#222c32}#thr span.on{background:var(--rd)}
#scr{position:relative;aspect-ratio:4/3;width:min(100%,calc(50vh*4/3));margin:auto;border:1px solid var(--ln);border-radius:6px;overflow:hidden;background:#000;box-shadow:inset 0 0 60px #000}
#view{position:absolute;inset:0;overflow:hidden;filter:grayscale(.55) contrast(1.15) brightness(.85) sepia(.2)}
#bg{width:100%;height:100%;object-fit:cover;display:block}
#fx{position:absolute;inset:0}
.fx{position:absolute;display:none;pointer-events:none}
.spr{mix-blend-mode:screen;transform:translate(-50%,-100%);width:auto}
.hand{mix-blend-mode:screen;width:30%;left:35%;top:20%}
.chair{width:26%;left:38%;top:22%;-webkit-mask-image:radial-gradient(closest-side,#000 50%,transparent 100%);mask-image:radial-gradient(closest-side,#000 50%,transparent 100%)}
.glow,.fog,.flick{left:0;top:0;width:100%;height:100%;mix-blend-mode:screen}
.flick{background:#000;mix-blend-mode:normal}.fog{filter:blur(8px)}
#nz{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;opacity:.12;transition:opacity .25s;mix-blend-mode:screen;pointer-events:none}
#scr:after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px)}
.lb{position:absolute;z-index:2;font:12px monospace;color:#fff;text-shadow:0 0 3px #000;pointer-events:none}
#lbl{left:8px;top:8px}#rec{right:8px;top:8px;color:#ff5a60}#rec:before{content:"● ";animation:bl 1s infinite}#ts{left:8px;bottom:8px;color:var(--am)}
@keyframes bl{50%{opacity:.2}}
#cams{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
@media(min-width:560px){#cams{grid-template-columns:repeat(6,1fr)}}
#cams button{text-align:left;padding:6px 8px;min-width:0}#cams b{display:block;font-size:12px}#cams small{display:block;font-size:11px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cams button.on{border-color:var(--rd);background:#2a1519}
#rb{background:#7d1e25;border-color:#c0444b;font-weight:600;padding:12px;font-size:16px}
#lg{flex:1;min-height:60px;overflow:auto;margin:0;padding:0;list-style:none;font-size:13px}
#lg li{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid #ffffff12}
#lg li img{width:44px;height:33px;object-fit:cover;border-radius:3px}
#lg time{font:11px monospace;color:var(--mu)}.g{color:var(--ok)}.b{color:#ff8a8f}
#sh{position:fixed;left:0;right:0;bottom:0;margin:auto;max-width:760px;background:#10181c;border:1px solid var(--ln);border-radius:14px 14px 0 0;padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px));transform:translateY(110%);transition:transform .22s;z-index:30}
#sh.on{transform:none}#sh h3{margin:0 0 8px;font:500 16px Mitr,sans-serif}
#sh button{display:block;width:100%;text-align:left;margin-bottom:6px}#sh small{color:var(--mu);margin-left:8px}
#ov{position:fixed;inset:0;z-index:40;background-size:cover;background-position:center;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px;gap:12px}
#ov h1{font:500 38px/1.15 Mitr,sans-serif;margin:0;color:#f0e4dc}#ov p{max-width:440px;margin:0;color:#b9c6bf}
#ov button{background:var(--rd);border-color:#f06068;font-weight:600;padding:12px 28px;font-size:17px}
#js{position:fixed;inset:0;z-index:50;background:#000;display:none}#js.on{display:block}
#js img{width:100%;height:100%;object-fit:cover;animation:jz 1.2s ease-in forwards,sh .12s steps(2) infinite}
@keyframes jz{from{transform:scale(.6);filter:brightness(.3)}to{transform:scale(1.25);filter:brightness(1.3) contrast(1.3)}}
@keyframes sh{50%{translate:8px -6px}}
@media(prefers-reduced-motion:reduce){#js img{animation:jz 1.2s ease-in forwards}}
#app{max-width:none;margin:0;padding:6px;display:grid;grid-template-columns:auto minmax(180px,1fr);grid-template-rows:auto auto auto 1fr;gap:6px 8px;height:100%}
#scr{grid-column:1;grid-row:1/5;height:calc(100vh - 12px);height:calc(100dvh - 12px);width:auto;max-width:calc(100vw - 200px);aspect-ratio:4/3;margin:0}
#hud,#cams,#rb,#lg{grid-column:2;min-width:0}
#hud{flex-wrap:wrap;gap:2px 8px}.bar{flex:1 1 60px}
#cams{grid-template-columns:1fr 1fr;gap:4px}
#cams button{display:flex;gap:5px;align-items:baseline;padding:3px 6px}#cams b,#cams small{display:inline;font-size:11px}
#rb{padding:8px;font-size:14px}#view{filter:none}#nz{mix-blend-mode:normal}
#fs{position:absolute;z-index:3;right:8px;bottom:8px;padding:2px 8px;background:#000a;font-size:16px}
#sh{inset:0;margin:0;max-width:none;border:0;border-radius:0;background:#000d;transform:none;visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px;gap:6px}
#sh.on{visibility:visible}#cats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:min(560px,100%)}
#sh button{margin:0}#sh small{display:block;margin:2px 0 0}#cx{width:min(560px,100%)}
#ns{display:flex;gap:6px}#ns button{padding:8px 14px;font-size:14px;background:var(--pn);border-color:var(--ln)}#ns button.on{border-color:var(--rd);background:#2a1519}#ns button:disabled{opacity:.35}
@media(max-height:460px){#ov{gap:8px;padding:12px}#ov h1{font-size:28px}#ov p{font-size:13px;line-height:1.35}}
#rot{display:none;position:fixed;inset:0;z-index:60;background:#050708;align-items:center;justify-content:center;text-align:center;padding:30px;font:500 20px/1.4 Mitr,sans-serif}
@media(orientation:portrait) and (max-width:820px){#rot{display:flex}}
@keyframes jz{from{transform:scale(.6);opacity:.35}to{transform:scale(1.25);opacity:1}}
#js:after{content:"";position:absolute;inset:0;background:#fff;opacity:0;animation:fl .35s .6s forwards}@keyframes fl{0%{opacity:.85}100%{opacity:0}}
html,body,button{touch-action:manipulation}
#ov{overflow-y:auto;justify-content:flex-start;-webkit-overflow-scrolling:touch}#ov>:first-child{margin-top:auto}#ov>:last-child{margin-bottom:auto}
#app{grid-template-columns:auto minmax(190px,1fr);grid-template-rows:100%}#scr{grid-row:1}
#pn{grid-column:2;grid-row:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:6px;-webkit-overflow-scrolling:touch}
#pn>*{flex:none}#hud{order:0}#rb{order:1;position:sticky;top:0;z-index:2}#cams{order:2}#lg{order:3;min-height:60px;overflow:visible}
.tk{position:absolute;z-index:3;width:40px;height:40px;margin:-20px 0 0 -20px;border:2px solid var(--rd);border-radius:50%;pointer-events:none;animation:tk 1.2s forwards}@keyframes tk{to{opacity:0;transform:scale(1.6)}}
#cmp{position:fixed;inset:0;z-index:45;background:#000e;overflow-y:auto;display:none;-webkit-overflow-scrolling:touch}#cmp.on{display:block}
.cb{max-width:760px;margin:auto;padding:12px}.cb h2{font:500 20px Mitr,sans-serif;margin:0}.tg{margin:2px 0 8px;color:var(--mu);font-size:13px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pair figure{margin:0}.pair figcaption{font-size:12px;color:var(--mu);margin-top:3px}
.mv{position:relative;aspect-ratio:4/3;overflow:hidden;background:#000;border:1px solid var(--ln)}.mv>img{width:100%;height:100%;object-fit:cover;display:block}
.fxw{position:absolute;inset:0}.ring{position:absolute;border:2px solid var(--rd);border-radius:6px;box-shadow:0 0 8px var(--rd)}
.cb dl{margin:10px 0}.cb dt{font-weight:600;color:var(--am);font-size:13px;margin-top:8px}.cb dd{margin:2px 0 0;font-size:14px}
.cb .x{position:sticky;bottom:6px;width:100%;background:#7d1e25;border-color:#c0444b;font-weight:600;padding:10px}
button:disabled{opacity:.4}#ov #shb{background:var(--pn);border-color:var(--ln)}
#scr{transition:filter .4s}#scr.bl{filter:blur(4px) brightness(1.5)}#js:after{animation-delay:0s!important}
@keyframes em{50%{background:#3a3213;border-color:var(--am)}}#cams button.em{animation:em .7s infinite}@media(prefers-reduced-motion:reduce){#cams button.em{animation:none;background:#3a3213;border-color:var(--am)}}
@keyframes ch{50%{background:#4a1218;border-color:#f06068}}#cams button.ch{animation:ch .5s infinite;border-color:var(--rd)}@media(prefers-reduced-motion:reduce){#cams button.ch{animation:none;background:#4a1218}}
</style></head><body>
<div id="app">
<div id="hud"><div id="clk">00:00</div><div class="bar" title="สติ"><i id="san"></i></div><div>คะแนน <b id="sc">0</b></div><div id="thr" title="ระดับอันตราย"><span></span><span></span><span></span><span></span><span></span></div></div>
<div id="scr"><div id="view"><img id="bg" alt="ภาพกล้องวงจรปิด"><div id="fx"></div></div><canvas id="nz" width="96" height="72"></canvas>
<div class="lb" id="lbl"></div><div class="lb" id="rec">REC</div><button id="fs" aria-label="เต็มจอ">⛶</button><div class="lb" id="ts"></div></div>
<div id="cams"></div>
<button id="rb">รายงานความผิดปกติ (R)</button>
<ul id="lg"></ul></div>
<div id="sh"><h3>สิ่งที่เห็นในกล้องนี้คือประเภทไหน</h3><div id="cats"></div><button id="cx">ยกเลิก</button></div>
<div id="ov"></div><div id="cmp"></div><div id="rot">หมุนมือถือเป็นแนวนอนเพื่อเล่น</div>
